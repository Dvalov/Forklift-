services:
  # PostgreSQL: единая база данных для всех трёх Django-сервисов
  db:
    image: postgres:16-alpine
    container_name: forklift_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forklift}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres12345}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-forklift}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Сервис управления погрузчиком и задачами (порт 8000)
  forklift_dashboard:
    build:
      context: ./forklift_dashboard
      dockerfile: Dockerfile
    container_name: forklift_dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DASHBOARD_SECRET_KEY:-django-insecure-forklift-dashboard-dev-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://localhost"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-forklift}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres12345}
      DB_HOST: db
      DB_PORT: 5432
      FORKLIFT_ID: ${FORKLIFT_ID:-1}
      WAREHOUSE_ID: ${WAREHOUSE_ID:-1}
      WAREHOUSE_URL: http://warehouse:8001
      CONVERTER_URL: http://converter:8002
      ANYLOGIC_URL: ${ANYLOGIC_URL:-http://host.docker.internal:8080}
      SEED_INITIAL_DATA: "true"
      ENABLE_SCHEDULER: "true"
    volumes:
      - dashboard_static:/app/staticfiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Сервис склада и ячеек (порт 8001)
  warehouse:
    build:
      context: ./Warehouse
      dockerfile: Dockerfile
    container_name: forklift_warehouse
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DJANGO_SECRET_KEY: ${WAREHOUSE_SECRET_KEY:-django-insecure-forklift-warehouse-dev-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8001,http://localhost"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-forklift}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres12345}
      DB_HOST: db
      DB_PORT: 5432
      ANYLOGIC_URL: ${ANYLOGIC_URL:-http://host.docker.internal:8080}
      ONEC_API_URL: ${ONEC_API_URL:-}
      ONEC_API_USER: ${ONEC_API_USER:-}
      ONEC_API_PASSWORD: ${ONEC_API_PASSWORD:-}
      ONEC_WAREHOUSE: ${ONEC_WAREHOUSE:-Склад1}
      SEED_INITIAL_DATA: "true"
    volumes:
      - warehouse_static:/app/staticfiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Сервис конвертации координат и поиска пути (порт 8002)
  converter:
    build:
      context: ./Converter
      dockerfile: Dockerfile
    container_name: forklift_converter
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DJANGO_SECRET_KEY: ${CONVERTER_SECRET_KEY:-django-insecure-forklift-converter-dev-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8002,http://localhost"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-forklift}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres12345}
      DB_HOST: db
      DB_PORT: 5432
      WAREHOUSE_URL: http://warehouse:8001
      SEED_INITIAL_DATA: "true"
    volumes:
      - converter_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  # Frontend: React 19 + TypeScript + Vite, обслуживается через Nginx (порт 5173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_FORKLIFT_ID: ${FORKLIFT_ID:-1}
        VITE_WAREHOUSE_ID: ${WAREHOUSE_ID:-1}
    container_name: forklift_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      forklift_dashboard:
        condition: service_started
      warehouse:
        condition: service_started
      converter:
        condition: service_started

volumes:
  # Персистентное хранилище базы данных PostgreSQL
  postgres_data:
    name: forklift_postgres_data
  # Статические файлы сервисов
  dashboard_static:
  warehouse_static:
  converter_static:
